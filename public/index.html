<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 26px;
  }
  p.subtitle {
    margin: 0 0 28px;
    color: #94a3b8;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #6366f1;
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #475569; cursor: not-allowed; }
  #result {
    margin-top: 24px;
    padding: 16px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid #334155;
    display: none;
  }
  #result.show { display: block; }
  #result a {
    color: #818cf8;
    word-break: break-all;
    font-weight: 600;
  }
  #result .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #copyBtn {
    width: auto;
    padding: 8px 14px;
    font-size: 13px;
    flex-shrink: 0;
  }
  #error {
    margin-top: 16px;
    color: #f87171;
    font-size: 14px;
    display: none;
  }
  .orig {
    margin-top: 8px;
    font-size: 12px;
    color: #94a3b8;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short link, like Bitly.</p>

    <form id="shortenForm">
      <label for="url">Long URL</label>
      <input type="text" id="url" placeholder="https://example.com/very/long/path" required>

      <label for="customCode">Custom code (optional)</label>
      <input type="text" id="customCode" placeholder="abc123">

      <button type="submit" id="submitBtn">Shorten URL</button>
    </form>

    <div id="error"></div>

    <div id="result">
      <div class="row">
        <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
        <button id="copyBtn">Copy</button>
      </div>
      <div class="orig" id="origUrl"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('shortenForm');
    const submitBtn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('error');
    const shortLink = document.getElementById('shortLink');
    const origUrl = document.getElementById('origUrl');
    const copyBtn = document.getElementById('copyBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      result.classList.remove('show');

      const url = document.getElementById('url').value.trim();
      const customCode = document.getElementById('customCode').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Shortening...';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, customCode: customCode || undefined })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'Something went wrong.';
          errorBox.style.display = 'block';
        } else {
          shortLink.href = data.shortUrl;
          shortLink.textContent = data.shortUrl;
          origUrl.textContent = 'Original: ' + data.originalUrl;
          result.classList.add('show');
        }
      } catch (err) {
        errorBox.textContent = 'Network error. Is the server running?';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Shorten URL';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => (copyBtn.textContent = 'Copy'), 1500);
      });
    });
  </script>
</body>
</html>
